__init__.py:
  title: LLM Extractor Adapters
  summary: Package provides unified interface for text summarization using LLM providers.
  details: 'Adapters include DSPyExtractor OllamaExtractor OpenAIExtractor FunctionExtractor
    MetadataExtractor ExtractionResult. Modules: base dspy_adapter function_adapter
    ollama_adapter openai_adapter. __all__ lists exported classes.'
base.py:
  title: Extraction Adapter Base Types and Protocols
  summary: Defines core data structures and protocol for extraction adapters to implement.
  details: ExtractionResult class with extracted_text str and structured_output ModelT;
    MetadataExtractor protocol with __call__ method taking raw_text str and char_budget
    str|int; output property returns structured model or text; uses dataclass frozen;
    TypeVar ModelT bound to BaseModel; Protocol defines callable contract for extraction
    pipeline.
crow_behavior.pdf:
  title: Crow Behavior and Roosting Patterns
  summary: Crows engage in mobbing behavior to deter predators and gather in urban
    areas for socialization and safety, dispersing to rural regions for breeding.
  details: 'Mobbing behavior targets owls/hawks. Staging areas before roosting. Quiet
    movement to roost sites. Communal roosting in late fall/early spring. Victoria
    Park gatherings. City advantages: predator avoidance, warmth, food sources. Disband
    in spring for rural breeding.'
dspy_adapter.py:
  title: DSPy-based Extractor Adapter
  summary: DSPy implementation for document summarization compatible with extractor
    contract. Uses Predict module with char_budget constraints.
  details: SummarizeDocument signature; raw_text,char_budget,output_schema inputs;
    extracted_text output field; temperature parameter; LM configuration; ExtractionResult
    output; JSON Schema compliance; telegraphic style; no markdown; plain text; semi-colon
    separated list
function_adapter.py:
  title: FunctionExtractor Adapter for Text Generation with Pydantic Validation
  summary: Adapts text generation frameworks to include Pydantic model validation
    for structured output.
  details: FunctionExtractor class; generate function parameter; output_model Pydantic
    BaseModel; build_prompt integration; char_budget parameter; ExtractionResult return
    type; serialized structured data parsing; JSON schema validation; raw_text input
    handling; typeVar ModelT; Callable interface; structured output parsing
ollama_adapter.py:
  title: Ollama Direct Client Extractor Adapter
  summary: Python client for Ollama compatible with extractor contract. Summarizes
    text using chat completion.
  details: OllamaExtractor class initializes with model host temperature output_model;
    uses ollama.Client to generate summaries via chat completion; __call__ processes
    raw_text char_budget constructs request with system/user prompts parses JSON response
    returns ExtractionResult
openai_adapter.py:
  title: OpenAI-Compatible API Extractor Adapter
  summary: Adapts OpenAI-compatible APIs for document extraction. Supports providers
    like OpenAI, OpenRouter, and vLLM with Pydantic model output.
  details: OpenAIExtractor class with model base_url api_key temperature. Uses OpenAI
    client constructs requests with system/user prompts. Processes responses via parse_output.
    Handles char_budget via user_prompt.
prompt.py:
  title: Prompt Construction Utilities
  summary: Functions generate structured extraction prompts with char budget constraints
  details: build_user_prompt formats document with char budget; build_prompt combines
    system prompt; SYSTEM_PROMPT enforces telegraphic style; retains port numbers
    file names; avoids markdown; uses semicolons for list separation; JSON output
    only
structured.py:
  title: Pydantic schema utilities
  summary: Provides functions for generating JSON schema instructions and parsing
    model outputs.
  details: schema_instruction builds JSON schema instruction strings; parse_output
    validates and serializes model responses; json_schema generates schema for Pydantic
    models. Handles Pydantic v1/v2 differences. Regex removes fenced code blocks.
