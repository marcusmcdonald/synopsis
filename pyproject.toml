[project]
name = "synopsis"
version = "0.1.0"
description = "Generate dense technical document and codebase corpus indexes with vector embeddings and FastMCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "binaryornot>=0.6.0",
    "docling>=2.120.3",
    "dspy>=3.3.0",
    "fastmcp>=3.4.7",
    "ollama>=0.6.2",
    "openai>=2.54.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
synopsis = "synopsis:synopsis"
synopsis-server = "server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
py-modules = ["synopsis", "server"]
